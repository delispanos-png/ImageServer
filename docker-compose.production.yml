services:
  mongodb:
    image: mongo:7.0
    container_name: mongodb_prod
    restart: always
    ports:
      - 27017:27017
    expose:
      - 27017
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./init:/docker-entrypoint-initdb.d:ro
      - ./backups:/backups
    command: mongod --auth
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'

  xml_generator:
    build:
      context: ../CloudonXMLGeneratorNew
      dockerfile: Dockerfile
    container_name: xml_generator_prod
    restart: always
    expose:
      - "80"
    volumes:
      - ../CloudonXMLGeneratorNew:/app
      - ${IMAGES_PATH}:/app/images:ro
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "80", "--workers", "2"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  fastapi:
    init: true
    user: "1000:1000"
    build:
      context: ./app
      network: host
    container_name: fastapi_prod
    restart: always
    ports:
      - "4030:80"
    env_file:
      - .env
    environment:
      MONGO_HOST: ${MONGO_HOST}
      MONGO_PORT: ${MONGO_PORT}
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      MONGO_DB: ${MONGO_DB}
      KPDHELLAS_BRIDGE_URL: http://host.docker.internal:8765
      PYTHONUNBUFFERED: 1
      LOG_LEVEL: INFO
    depends_on:
      mongodb:
        condition: service_healthy
      xml_generator:
        condition: service_healthy
      kpdhellas_bridge:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./app:/app
      - ${IMAGES_PATH}:/app/images
      - ${CATEGORY_LOOKUP_XLSX_HOST_PATH}:/app/295_categories.xlsx:ro
      - ./logs:/app/logs
    command: uvicorn main:app --host 0.0.0.0 --port 80 --workers 4 --log-level info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 2G
          cpus: '1.0'

  kpdhellas_bridge:
    init: true
    user: "1000:1000"
    build:
      context: ./app
      network: host
    container_name: kpdhellas_bridge_prod
    network_mode: host
    restart: always
    volumes:
      - ./app:/app
      - ./logs:/app/logs
    command: python /app/kpdhellas_bridge_server.py
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8765/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # Optional: Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - /home/imageuser/cms-admin-dist:/usr/share/nginx/html/admin:ro
      - /home/imageuser/cms-portal-dist:/usr/share/nginx/html/portal:ro
      - ${IMAGES_PATH}:/usr/share/nginx/html/photos:ro
    depends_on:
      - fastapi
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
