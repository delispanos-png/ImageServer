# Allow imageuser to restart nginx without password — required by service_watchdog.
#
# INSTALL (run once, as a user with sudo):
#   sudo cp /home/imageuser/imageDataAPI/service_watchdog_sudoers.conf \
#           /etc/sudoers.d/imageuser-watchdog
#   sudo chmod 0440 /etc/sudoers.d/imageuser-watchdog
#   sudo visudo -cf /etc/sudoers.d/imageuser-watchdog   # validate
#
imageuser ALL=(root) NOPASSWD: /bin/systemctl restart nginx, /bin/systemctl is-active nginx, /bin/systemctl status nginx
